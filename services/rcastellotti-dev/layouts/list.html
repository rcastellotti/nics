{{ define "main" }}
  <h1>{{ lower .Title }}</h1>
  <ul class="posts">
    {{ range .Pages.ByDate.Reverse }}
      <li>
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        {{ if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>{{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
